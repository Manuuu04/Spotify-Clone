<!DOCTYPE html>
<html>
    <head>
        <title>Clone-Spotify</title>
        <link rel="stylesheet" type="text/css" href="Clon-Spotify.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body id="body">
        <audio id="audio" src="/assets/music/Callaita.mp3"></audio>
        <header id="topbar">

            <div class="topbar-left">
                <button>←</button>
                <button>→</button>

                <div id="topbar-search" class="topbar-search">
                    <input id="browser-top" type="text" placeholder="Search music, artists, albums...">
                    <div id="top-search-results" class="search-results">

                    </div>
                </div>
            </div>

            <div class="topbar-right">
                <button>Upgrade</button>
                <button>User 👤</button>
            </div>

        </header>
        
        <div id="sidebar" class="sidebar">
        
            <header id="header" class="header">

                <div id="mini-header" class="mini-header">

                    <button id="library" class="library">Your library</button>
                
                    <button id="add" class="text add">➕ Create</button>
                
                    <button id="expand" class="text">↗</button>
                
                </div>
            
                <div id="buttons-header" class="buttons-header">
                
                    <button  id="btnplaylist" class="text">Playlists</button>
                
                    <button id="btnArtists" class="text">Artists</button>
                
                    <button id="btnAlbums" class="text">Albums</button>
                
                    
                </div>

            </header>
            
            <div id="playlists">
                <button id="browser" class="text browser">🔎︎</button>
                <button id="recent" class="recent">Recent  ☰</button>
                
            </div>
        
            <div id="sidebar-container" class="sidebar-container">
                <div id="container" class="container">
        
                </div>
            </div>
        </div>

        <div id="center" class="center">
            <div id="center-content" class="center-content">
                <img id="header-image" src="/assets/img/flecha.png" alt="">
                <div>
                    <h4 id="h4-header"></h4>
                    <h1 id="h1-header">Click any one</h1>
                    <p id="p-header"></p>
                </div>
            </div>
            <div id="center-section" class="center-section">
                
            </div>
        </div>

        <footer id="footer" class="footer">
            <div class="song" id="song">
                <img src="/assets/img/callaita.jpg" alt="song image" id="rep-image">
                <div class="text">
                    <h3 id="h3Rep">Callaita</h3>
                    <p id="singers">Bad bunny</p>
                </div>
            </div>
            <div id="reproducer" class="reproducer">
                <button id="random" class="random">↻</button>
                <button id="previous" class="previous">◄◄</button>
                <button id="play" class="play" class="btn-play">▶️</button>
                <button id="next" class="next">►►</button>
                <button id="repeat" class="repeat">↺</button>
                <div id="reproducer-bar">
                    <span id="current-time" class="current-time">0:00</span>
                    <input id="time-bar" class="time-bar" type="range">
                    <span id="duration" class="duration">4:11</span>
                </div>
            </div>
            <div id="footer-btns">
                <button id="">🎧</button>
                <button id="">🎤</button>
                <button id="">☰</button>
                <button id="">🖥️</button>
                <button id="">⛶</button>
            </div>
        </footer>

        <script src="Sidebar.js"></script>
    </body>
</html>
